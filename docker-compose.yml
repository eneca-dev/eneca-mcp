version: '3.9'

services:
  mcp_server:
    build: .
    container_name: mcp_server
    restart: always
    # Порт 8080 (слева сервер, справа контейнер)
    ports:
      - "8080:8080"
    # Секреты берем из файла .env (который создадим на сервере руками)
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"